[project]
name = "class-fund-backend"
version = "0.1.0"
description = "Class Fund backend: API, PostgreSQL ledger, RBAC, idempotency, AI verification, campaigns, activity feed."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.16,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "PyJWT>=2.10,<3.0",
  "argon2-cffi>=25.1,<26.0",
  "python-multipart>=0.0.20,<1.0",
  "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "class-fund-backend"
version = "1.0.0"
description = "Class Fund backend: API, MySQL ledger, RBAC, idempotency, AI verification, campaigns, activity feed."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
  "redis>=5.0,<6.0",
  "alembic>=1.16,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "pydantic>=2.8.0,<3.0",
  "PyJWT>=2.10,<3.0",
  "argon2-cffi>=25.1,<26.0",
  "python-multipart>=0.0.20,<1.0",
  "email-validator>=2.2,<3.0",
  "pillow>=10.4.0,<11.0",
  "numpy>=1.26.0,<3.0",
  "opencv-python-headless>=4.10.0,<5.0",
  "rapidfuzz>=3.10.0,<4.0",
  "imagehash>=4.3.1,<5.0",
  "pytesseract>=0.3.10,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "testcontainers>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "worker*", "ai*"]
exclude = ["tests*", "alembic*", "scripts*", "docs*", "storage*"]

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: classfund
      POSTGRES_USER: classfund
      POSTGRES_PASSWORD: classfund
    ports:
      - "5432:5432"
    volumes:
      - classfund_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classfund -d classfund"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  classfund_pgdata:

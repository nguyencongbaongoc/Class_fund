    <meta property="og:title" content="ClassFund - Quỹ Lớp Liquid Glass" />
    <meta property="og:description" content="Hệ thống quản lý quỹ lớp hiện đại với giao diện Liquid Glass chuẩn mực cao cấp, quản lý thu chi, đợt thu, sao kê minh bạch và nhận diện biên lai chuyển khoản." />

    <script>
      (function() {
        // 1. Safeguard against "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (e) {}

        // 2. Safeguard against "THREE.WebGLRenderer: Cannot read properties of null (reading 'precision')"
        try {
          var standardPrecision = { rangeMin: 127, rangeMax: 127, precision: 23 };
          var patchPrecision = function(proto) {
            if (proto && proto.getShaderPrecisionFormat) {
              var orig = proto.getShaderPrecisionFormat;
              proto.getShaderPrecisionFormat = function(shaderType, precisionType) {
                try {
                  var res = orig.call(this, shaderType, precisionType);
                  if (res && typeof res.precision === 'number' && res.precision > 0) {
                    return res;
                  }
                } catch (err) {}
                return standardPrecision;
              };
            }
          };

          if (typeof WebGLRenderingContext !== 'undefined') {
            patchPrecision(WebGLRenderingContext.prototype);
          }
          if (typeof WebGL2RenderingContext !== 'undefined') {
            patchPrecision(WebGL2RenderingContext.prototype);
          }

          if (typeof HTMLCanvasElement !== 'undefined' && HTMLCanvasElement.prototype.getContext) {
            var origGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, attrs) {
              var ctx = origGetContext.apply(this, arguments);
              if (ctx && (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl')) {
                if (typeof ctx.getShaderPrecisionFormat === 'function') {
                  var origPrec = ctx.getShaderPrecisionFormat;
                  ctx.getShaderPrecisionFormat = function(st, pt) {
                    try {
                      var r = origPrec.call(this, st, pt);
                      if (r && typeof r.precision === 'number' && r.precision > 0) return r;
                    } catch (e) {}
                    return standardPrecision;
                  };
                }
              }
              return ctx;
            };
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <!-- Global Apple Liquid Glass Optical Refraction SVG Filters -->
    <svg class="hidden" style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
      <defs>
        <!-- Physical Lens Curvature & Light Refraction Filter -->
        <filter id="apple-light-bend-filter" x="-20%" y="-20%" width="140%" height="140%" colorInterpolationFilters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.015 0.015" numOctaves="2" result="noise" seed="42" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" result="refracted" />
          <feGaussianBlur in="refracted" stdDeviation="0.4" result="blurred" />
          <feBlend in="SourceGraphic" in2="blurred" mode="normal" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
